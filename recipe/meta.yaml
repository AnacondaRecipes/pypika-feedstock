{% set name = "pypika" %}
{% set version = "0.51.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: c30c7c1048fbf056fd3920c5a2b88b0c29dd190a9b2bee971fd17e4abe4d0ebe

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - typing_extensions >=4.5.0  # [py<311]

test:
  imports:
    - pypika
    - pypika.clickhouse
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/kayak/pypika
  dev_url: https://github.com/kayak/pypika
  doc_url: https://pypika.readthedocs.io
  summary: A SQL query builder API for Python
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - mccarthyryanc
    - thewchan
